[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inheritance-math"
version = "0.1.0a1"
description = "Coherent Inheritance Framework (CIF) — a mathematical modeling library for how knowledge, authority, constraints, and meaning survive transmission across system boundaries."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Derek Hone", email = "derek@executionproof.io" },
]
maintainers = [
    { name = "Remnant Fieldworks Inc." },
]
keywords = [
    "inheritance",
    "coherence",
    "transmission",
    "graph-laplacian",
    "ai-alignment",
    "agent-delegation",
    "fixed-point",
    "dynamical-systems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://executionproof.io"
Repository = "https://github.com/derekhone"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
